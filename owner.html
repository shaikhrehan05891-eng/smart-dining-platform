
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROYAL SPICE | Owner Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#090909;color:#fff;font-family:Arial,sans-serif}
header{background:#15120d;border-bottom:1px solid #b99545;padding:22px}
h1{color:#d6b45c;letter-spacing:3px}
header p{color:#aaa;margin-top:7px}
main{padding:20px;max-width:1100px;margin:auto}
h2{color:#d6b45c;margin:20px 0}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:#171717;border:1px solid #705a2e;border-radius:12px;padding:20px}
.card small{color:#aaa}
.card h3{color:#e6c36a;font-size:25px;margin-top:12px}
.panel{background:#171717;border:1px solid #705a2e;border-radius:12px;padding:18px;margin-top:16px}
button{background:#c49a42;color:#111;border:0;padding:12px 16px;border-radius:7px;font-weight:bold;cursor:pointer;margin-top:12px}
input{background:#222;color:white;border:1px solid #806936;padding:12px;width:100%;border-radius:7px;margin-top:10px}
.order{border-bottom:1px solid #444;padding:15px 0}
.status{color:#e5bd61;margin-top:6px}
@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header>
<h1>ROYAL SPICE</h1>
<p>Restaurant Owner Dashboard</p>
</header>
<main>
<h2>Business Overview</h2>
<div class="stats">
<div class="card"><small>Total Orders</small><h3 id="total">0</h3></div>
<div class="card"><small>Pending Orders</small><h3 id="pending">0</h3></div>
<div class="card"><small>Completed Orders</small><h3 id="completed">0</h3></div>
<div class="card"><small>Today's Sales</small><h3 id="sales">₹0</h3></div>
</div>

<h2>Kitchen Order Management</h2>
<div class="panel">
<div id="orders">No orders available yet.</div>
</div>

<h2>Quick Table Management</h2>
<div class="panel">
<p>Restaurant tables</p>
<input id="tables" type="number" min="1" placeholder="Enter number of tables">
<button onclick="saveTables()">Save Tables</button>
<p id="tableResult" class="status"></p>
</div>
<p style="color:#777;text-align:center;margin:30px 0">
ROYAL SPICE · PREMIUM DINING PLATFORM
</p>
</main>
<script>
function getOrders(){
try{return JSON.parse(localStorage.getItem("royalOrders")||"[]")}
catch(e){return []}
}
function update(){
let orders=getOrders();
document.getElementById("total").textContent=orders.length;
document.getElementById("pending").textContent=orders.filter(o=>o.status!=="Completed").length;
document.getElementById("completed").textContent=orders.filter(o=>o.status==="Completed").length;
let sales=orders.filter(o=>o.status==="Completed").reduce((s,o)=>s+Number(o.total||0),0);
document.getElementById("sales").textContent="₹"+sales;
let box=document.getElementById("orders");
if(!orders.length){box.textContent="No orders available yet.";return}
box.innerHTML="";
orders.forEach((o,i)=>{
let div=document.createElement("div");
div.className="order";
let title=document.createElement("strong");
title.textContent="Order #"+(i+1)+" - "+(o.status||"Pending");
let detail=document.createElement("p");
detail.textContent="Table: "+(o.table||"N/A")+" | Total: ₹"+Number(o.total||0);
let btn=document.createElement("button");
btn.textContent=o.status==="Completed"?"Completed":"Mark Completed";
btn.disabled=o.status==="Completed";
btn.onclick=()=>{
orders[i].status="Completed";
localStorage.setItem("royalOrders",JSON.stringify(orders));
update();
};
div.append(title,detail,btn);
box.appendChild(div);
});
}
function saveTables(){
let n=Number(document.getElementById("tables").value);
if(!Number.isInteger(n)||n<1){alert("Enter a valid table count");return}
localStorage.setItem("royalTableCount",n);
document.getElementById("tableResult").textContent=n+" tables saved on this device.";
}
update();
document.getElementById("tables").value=localStorage.getItem("royalTableCount")||"";
</script>
</body>
</html>
